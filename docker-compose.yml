version: "3.8"

services:
  # 1. Service S3 Local (MinIO) - Niveau 2
  s3-minio:
    image: minio/minio:RELEASE.2024-01-18T22-51-28Z
    container_name: pipeline_s3_minio
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # MinIO Web Console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Initialisation du bucket S3 'finance-transactions'
  minio-init-bucket:
    image: minio/mc:latest
    container_name: pipeline_minio_init
    depends_on:
      s3-minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set local http://s3-minio:9000 minioadmin minioadmin;
      /usr/bin/mc mb local/finance-transactions || true;
      exit 0;
      "

  # 2. Service Base de Données Relationnelle (PostgreSQL) - Niveau 1.3 & Niveau 3 Option 1
  postgres-db:
    image: postgres:15-alpine
    container_name: pipeline_postgres_db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: finance_user
      POSTGRES_PASSWORD: finance_password
      POSTGRES_DB: finance_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finance_user -d finance_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 3. Système de Traitement des Données avec Scheduler CD - Niveau 3 Option 1
  data-pipeline-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: pipeline_cd_worker
    depends_on:
      postgres-db:
        condition: service_healthy
      s3-minio:
        condition: service_healthy
    environment:
      - DB_URL=postgresql://finance_user:finance_password@postgres-db:5432/finance_db
      - S3_ENDPOINT_URL=http://s3-minio:9000
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin
      - S3_BUCKET_NAME=finance-transactions
      - POLL_INTERVAL_SECONDS=10
      - RETRY_MAX_ATTEMPTS=3
    volumes:
      - ./data:/app/data

volumes:
  minio_data:
  postgres_data:
